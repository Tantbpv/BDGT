services:
  postgres:
    image: postgres:16-alpine
    container_name: bdgt_postgres
    environment:
      POSTGRES_DB: bdgt_dev
      POSTGRES_USER: bdgt
      POSTGRES_PASSWORD: bdgt_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdgt"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    # For NVIDIA GPU: uncomment the deploy block below and set NVIDIA_VISIBLE_DEVICES
    # image: ollama/ollama:latest  # keep for NVIDIA
    # For AMD GPU: change image to ollama/ollama:rocm
    image: ollama/ollama:latest
    container_name: bdgt_ollama
    ports:
      - "666:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=-1
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
